[package]
name = "codex-reset-status"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Show when local ChatGPT/Codex reset credits expire"
repository = "https://github.com/pavelbe/codex-reset-status"
readme = "README.md"
keywords = ["codex", "cli", "rate-limit", "reset"]
categories = ["command-line-utilities"]

[[bin]]
name = "codex-reset-status"
path = "src/main.rs"

[dependencies]
jiff = "0.2.35"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "3.3.0", default-features = false, features = ["platform-verifier", "rustls"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
